name: Claude PR review

# The automatic Claude PR review as a reusable workflow. Each repository that uses it keeps a thin
# caller at .github/workflows/claude-review.yml (template: examples/claude-review.yml) with its
# triggers, the concurrency block and the token permissions, plus its own gate config and prompt.
# How it works: docs/how-it-works.md. Why it is one central repository: ADR-0176 in TUBS-IVS/eqasim-bs.
#
# A model-free gate job (claude_review.py check-config and classify, thresholds in the caller's
# .github/claude-review.yml) decides whether a review runs and at which tier; only then is the API
# called. Each review records how its run ended (status, turns, duration) in the job summary and as
# an artifact; no output shows the API cost (docs/how-it-works.md, "Run record"). The review posts
# comments only; it is not a required check.
#
# The review runs in rounds: the state and interdiff commands read the earlier rounds from the bot's
# summary comment and compare the PR at the last reviewed commit and at head, so a further round
# reviews only what changed, verifies the open findings and stops after the configured number of
# automatic rounds (ADR-0171 in TUBS-IVS/eqasim-bs).
#
# Both jobs run claude_review.py from the repository and commit of THIS workflow file
# (job.workflow_repository, job.workflow_sha), fetched outside the reviewed checkout: a caller on @v1,
# on an exact tag or on a test branch runs the script of that same version, and a pull request cannot
# change the script that reviews it.
#
# No concurrency block here: a called workflow sees the caller's github context, and a group shared
# by caller and called workflow deadlocks. The caller holds it.

on:
  workflow_call:
    inputs:
      config:
        description: The gate config of the calling repository, relative to its root.
        type: string
        default: .github/claude-review.yml
    secrets:
      ANTHROPIC_API_KEY:
        description: API key of a workspace of the Console organization (an organization-level key fails).
        required: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      tier: ${{ steps.gate.outputs.tier }}
      model: ${{ steps.gate.outputs.model }}
      max_turns: ${{ steps.gate.outputs.max_turns }}
      mode: ${{ steps.gate.outputs.mode }}
      diff_source: ${{ steps.gate.outputs.diff_source }}
      round: ${{ steps.gate.outputs.round }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fails when the workflow cannot name its own version: it never falls back to a branch or tag.
      - name: Fetch the review tool at the version of this workflow
        env:
          TOOL_REPO: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$TOOL_REPO" ] || [ -z "$TOOL_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty: the version of the review tool is unknown, so nothing runs."
            exit 1
          fi
          tool_dir="$RUNNER_TEMP/claude-pr-review"
          git init -q "$tool_dir"
          for attempt in 1 2 3; do
            if git -C "$tool_dir" fetch -q --depth 1 "https://github.com/$TOOL_REPO" "$TOOL_SHA"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::cannot fetch $TOOL_REPO@$TOOL_SHA"; exit 1; fi
            sleep 10
          done
          git -C "$tool_dir" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$tool_dir" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::fetched $(git -C "$tool_dir" rev-parse HEAD), expected $TOOL_SHA"; exit 1
          fi
          echo "TOOL=$tool_dir/claude_review.py" >> "$GITHUB_ENV"
          echo "Review tool: $TOOL_REPO@$TOOL_SHA"
          printf '### Claude review tool\n\n- `%s@%s`\n' "$TOOL_REPO" "$TOOL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install gate dependencies
        run: pip install pyyaml

      - name: Decide whether and how to review (no model call)
        id: gate
        env:
          CONFIG: ${{ inputs.config }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fork and Dependabot PRs get no Actions secrets; say so instead of failing later.
          if [ "$SAME_REPO" != "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### Claude review gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped: fork or Dependabot PR, no API secret available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A broken or unbounded config or prompt stops here, before anything is spent.
          python "$TOOL" check-config --config "$CONFIG"
          # quotepath=false: non-ASCII paths stay literal, so they still match the globs.
          git -c core.quotepath=false diff --numstat "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/numstat.tsv"
          # Added, deleted and renamed files: a structure change of the structure paths gets the deep tier.
          git -c core.quotepath=false diff --name-status -M "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/name-status.tsv"
          # The review history of the PR and the file-level interdiff since the last reviewed commit.
          python "$TOOL" state --repo "$REPO" --pr "$PR_NUMBER" --out "$RUNNER_TEMP/state.json"
          python "$TOOL" interdiff --config "$CONFIG" \
            --state "$RUNNER_TEMP/state.json" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --out-dir "$RUNNER_TEMP/interdiff"
          draft_flag=""
          if [ "$IS_DRAFT" = "true" ]; then draft_flag="--draft"; fi
          python "$TOOL" classify \
            --config "$CONFIG" \
            --numstat "$RUNNER_TEMP/numstat.tsv" --name-status "$RUNNER_TEMP/name-status.tsv" \
            --branch "$HEAD_REF" --labels "$LABELS" $draft_flag \
            --event-action "$EVENT_ACTION" --event-label "$EVENT_LABEL" \
            --state "$RUNNER_TEMP/state.json" \
            --interdiff-json "$RUNNER_TEMP/interdiff/interdiff.json" \
            --interdiff-numstat "$RUNNER_TEMP/interdiff/interdiff.numstat"

  review:
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Runs of up to 19 minutes were seen; a job cut off by the timeout loses its run record.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      # Claude Code CLI, pinned for reproducible review behaviour. 2.1.309 is the version
      # claude-code-action v1.0.259 installed and that reached the API with Opus 5.5.
      CLAUDE_CODE_VERSION: "2.1.309"
      CONFIG: ${{ inputs.config }}
      TIER: ${{ needs.classify.outputs.tier }}
      MODEL: ${{ needs.classify.outputs.model }}
      MODE: ${{ needs.classify.outputs.mode }}
      DIFF_SOURCE: ${{ needs.classify.outputs.diff_source }}
      ROUND: ${{ needs.classify.outputs.round }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the script diffs base...head with local git, as the gate does.
          fetch-depth: 0
      # The same version as the gate job: both read job.workflow_sha of this file.
      - name: Fetch the review tool at the version of this workflow
        env:
          TOOL_REPO: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$TOOL_REPO" ] || [ -z "$TOOL_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty: the version of the review tool is unknown, so nothing runs."
            exit 1
          fi
          tool_dir="$RUNNER_TEMP/claude-pr-review"
          git init -q "$tool_dir"
          for attempt in 1 2 3; do
            if git -C "$tool_dir" fetch -q --depth 1 "https://github.com/$TOOL_REPO" "$TOOL_SHA"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::cannot fetch $TOOL_REPO@$TOOL_SHA"; exit 1; fi
            sleep 10
          done
          git -C "$tool_dir" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$tool_dir" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::fetched $(git -C "$tool_dir" rev-parse HEAD), expected $TOOL_SHA"; exit 1
          fi
          echo "TOOL=$tool_dir/claude_review.py" >> "$GITHUB_ENV"
          echo "Review tool: $TOOL_REPO@$TOOL_SHA"
          printf '### Claude review tool\n\n- `%s@%s`\n' "$TOOL_REPO" "$TOOL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install review dependencies
        run: |
          pip install pyyaml
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # State and interdiff are recomputed here: no artifacts travel between the jobs.
      - name: Read the review history and compute the interdiff (no model call)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$TOOL" state --repo "$REPO" --pr "$PR_NUMBER" --out "$RUNNER_TEMP/state.json"
          python "$TOOL" interdiff --config "$CONFIG" \
            --state "$RUNNER_TEMP/state.json" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --out-dir "$RUNNER_TEMP/interdiff"
      # Why claude -p and not anthropics/claude-code-action: docs/how-it-works.md.
      - name: Claude review (read-only, structured findings)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$TOOL" review --config "$CONFIG" \
            --tier "$TIER" --repo "$REPO" --pr "$PR_NUMBER" --sha "$HEAD_SHA" --base-sha "$BASE_SHA" \
            --state "$RUNNER_TEMP/state.json" --interdiff-dir "$RUNNER_TEMP/interdiff" \
            --diff-source "$DIFF_SOURCE" --mode "$MODE" --round "$ROUND" \
            --out "$RUNNER_TEMP/claude-review-result.json"
      - name: Record how the review run ended
        if: always()
        run: |
          python "$TOOL" outcome --execution-file "$RUNNER_TEMP/claude-review-result.json" \
            --tier "$TIER" --model "$MODEL" --json claude-review-cost.json
      # Also after a failed review step: a run that called the model is then recorded as an incomplete
      # round, so it counts against the round cap; without a result the step only says so.
      - name: Post review comments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$TOOL" post --result "$RUNNER_TEMP/claude-review-result.json" \
            --repo "$REPO" --pr "$PR_NUMBER" --tier "$TIER" --sha "$HEAD_SHA" \
            --diff-file .claude/review-pr.diff --config "$CONFIG" \
            --state "$RUNNER_TEMP/state.json" --interdiff-dir "$RUNNER_TEMP/interdiff" \
            --mode "$MODE" --round "$ROUND" \
            --record "$RUNNER_TEMP/claude-review-findings.json"
      # The file and artifact keep their v1 names (README.md, "Contract with the session retro");
      # since v1.3.0 the record carries no cost.
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-cost-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: claude-review-cost.json
          if-no-files-found: warn
          retention-days: 90
      # The maintainer's session retro (~/.claude/retro, retro_reviews.py) downloads this record, by
      # this name, from the runs of each caller's claude-review.yml; see docs/how-it-works.md.
      - name: Upload findings record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-findings-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-review-findings.json
          if-no-files-found: warn
          retention-days: 90
